title: Robert Grantham Art
tagline: Contemporary paintings rooted in memory, pressure, and resilience.
description: Contemporary abstract acrylic paintings by Robert Grantham in Austin, Texas. View original works, current series, and commission information.

author:
  name: Robert Grantham
  email: robertgrantham40@gmail.com
  location: Austin, TX

url: https://rgrantham82.github.io
baseurl: ''

# Aesthetics
theme_color_light: '#faf9f6'
theme_color_dark: '#0b0c0f'
font_href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
logo: /assets/images/logo.png
favicon: /assets/images/favicon.png
apple_touch_icon: /assets/images/apple-touch-icon.png
og_image: /assets/images/og-default.jpg   # 1200x630, 68 KB — under X's 5 MB card limit


google_analytics: "G-7WZFJ98W4K"

# Social integration
github_username: rgrantham82
instagram_username: robertgranthamart
linkedin_username: robertgrantham82
email: robertgrantham40@gmail.com

# Trade & corporate sales
# Single source of truth for the terms published on /trade.html. Change them
# here rather than in the page body, so the page and any generated tearsheet
# can never quietly disagree with each other.
trade:
  discount: 20              # percent off published retail, qualified professionals
  volume_discount: 25       # percent off retail, placements of 5+ works
  volume_threshold: 5
  hold_days: 10             # business days, no charge, during client approval
  approval_days: 14         # on-approval trial, Austin metro
  deposit: 50               # percent deposit on commissions
  terms: 'Net 30 against a signed purchase order for established firms'
  resale_form: 'Texas Sales and Use Tax Resale Certificate (Form 01-339)'
  contact_phone: '512-200-3563'

# Jekyll Engine Settings
markdown: kramdown
highlighter: rouge
permalink: /:title.html
timezone: America/Chicago
encoding: utf-8
future: true
lsi: false
safe: true
data_dir: _data
# NOTE: `paginate` was removed. jekyll-paginate was never listed under `plugins`,
# so it never loaded; the blog already falls back to `site.posts` and filters
# client-side. Re-add both the plugin and the keys together, or not at all.

# Architecture
collections:
  posts:
    output: true
    permalink: /blog/:title.html
  works:
    output: true
    permalink: /portfolio/:name/

defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    author: Robert Grantham
- scope:
    path: ''
    type: works
  values:
    layout: work
    css: /assets/css/work.css

# NOTE: `_data` was removed from `include`. Jekyll already reads it via
# `data_dir`; forcing it into `include` also copied the raw YAML into _site,
# publishing the source data alongside the rendered pages. `assets` does not
# begin with `_` or `.`, so it is included by default and needs no entry here.
include:
- assets

exclude:
- node_modules
- Gemfile
- Gemfile.lock
- README.md
- IMPROVEMENTS.md
- vendor
- .sass-cache
- .jekyll-cache
- _site

nav:
  links:
  - title: Available Work
    url: /portfolio/
  - title: Buying Art
    url: /buying.html
  - title: Commissions
    url: /commissions.html
  - title: About
    url: /about.html
  - title: Journal
    url: /blog/
  cta:
    title: Contact
    url: /contact.html
  # Secondary pages. These serve specific audiences rather than general
  # visitors, and render in the footer — the same position Portraiture and
  # Studio services already occupied when they were hardcoded in the layout.
  secondary:
  - title: Trade & Corporate
    url: /trade.html
  - title: Portraiture
    url: /portraiture.html
  - title: Studio services
    url: /services.html

plugins:
- jekyll-feed
- jekyll-sitemap
