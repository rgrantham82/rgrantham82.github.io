# _data/catalog.yml
# Source of truth for /catalog.html. The PDF in assets/docs is generated from
# the same record; update both together when a work sells or a new plate is added.
# NOTE: every work needs a `size` value. Liquid's `.size` on a hash returns the
# number of keys when the field is missing, which is how a stray "4" appeared.
