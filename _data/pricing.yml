# _data/pricing.yml
# Robert Grantham Art: the price ladder
#
# One artwork price per work, everywhere: this website, Saatchi Art,
# exhibitions, and direct sales. Saatchi displays all-in prices: the artwork
# price below plus the shipping Saatchi calculates for the size. Prices never go down. Raise them after about five sales
# at a price point, or about 10% a year, whichever comes first.
#
# Contact: robertgrantham40@gmail.com, 512-200-3563,
#          rgrantham82.github.io, Instagram @robertgranthamart

# NOTE (2026-11-12): the ladder below was aligned to the October 2026 catalog
# price schedule — the site was publishing three different prices for the same
# sizes (the September ladder here, the _works front matter, and the catalog),
# and the trade page's bands were a fifth. The catalog is the newest published
# schedule and the one the December show checklist uses, so it wins. The
# September ladder is preserved in git history, not here.
# The catalog schedule is nearly flat per square inch (~$2.57–2.58), which is
# why the old per-size discount curve in the 30x40 derivation no longer applies.

effective: 2026-10-01
previous_ladder:
  name: base tier
  retired: 2026-09-16
  note: >-
    The exhibition tier was scheduled for 2026-12-01 and took effect early
    when Saatchi listings moved to it on 2026-09-16.

currency: USD
depth_in: 1.5          # every rung assumes 1.5 in cradled or stretched depth
includes: >-
  Certificate of authenticity, Austin delivery and hanging. Shipping quoted
  separately. Three-payment plan available on works over $500.
sales_tax:
  austin_combined_rate: 0.0825   # 6.25% state, 1% city, 1% Capital Metro; checked 2026-09-16
  note: Tax is added to the listed price, not included in it.

ladder:
  - size: "8×10"
    width_in: 8
    height_in: 10
    sq_in: 80
    price: 205
    rate_per_sq_in: 2.563
  - size: "12×12"
    width_in: 12
    height_in: 12
    sq_in: 144
    price: 370
    rate_per_sq_in: 2.569
  - size: "16×20"
    width_in: 16
    height_in: 20
    sq_in: 320
    price: 825
    rate_per_sq_in: 2.578
  - size: "20×24"
    width_in: 20
    height_in: 24
    sq_in: 480
    price: 1235
    rate_per_sq_in: 2.573
    note: >-
      Raised from $950 on 2026-09-16 because both 20×24s were already
      published at $1,000; raised again to the October 2026 catalog figure
      on 2026-11-12.
  - size: "24×30"
    width_in: 24
    height_in: 30
    sq_in: 720
    price: 1855
    rate_per_sq_in: 2.576
  - size: "30×40"
    width_in: 30
    height_in: 40
    sq_in: 1200
    price: 3100
    rate_per_sq_in: 2.583
    note: >-
      Now a published catalog rung (October 2026); the old derivation from
      the 24×30 rate no longer applies — the schedule runs nearly flat at
      about $2.58 per square inch.

new_size_rule: >-
  For a size not on the ladder, multiply its square inches by the rate of the
  nearest listed size, take 10% off that rate for every full 200 square inches
  of difference, then round up: to the nearest $10 below $500, to the nearest
  $25 at $500 and above.

exceptions: []   # Red Shore's former $1,400 Saatchi figure included shipping; its artwork price is $1,000.

venues:
  saatchi_art:
    commission: 0.40          # of the artwork price, excluding shipping
    pricing: all-in           # listed price = artwork price + Saatchi-calculated shipping
    packaging_paid_by: artist
    listed_2026_09_16:        # as shown on saatchiart.com/robertgrantham
      - {size: "12×12", artwork_price: 385,  listed: 425,  shipping: 40}
      - {size: "16×20", artwork_price: 700,  listed: 865,  shipping: 165}
      - {size: "20×24", artwork_price: 1000, listed: 1205, shipping: 205}
      - {size: "24×30", artwork_price: null, listed: 1820, shipping: null, note: "Aurum Rising; ladder price is 1275, which would mean 545 shipping; confirm the artwork price entered"}
    note: >-
      Promotional discounts come off the listed price before Saatchi's split,
      so a promotion lowers the artist's net as well as the buyer's price.
  nwhumc:
    name: Northwest Hills United Methodist Church
    commission: 0.20
    applies_to: pre-tax price
    get_in_writing: true

